spring:
  main:
    web-application-type: servlet

  datasource:
    url: jdbc:h2:mem:auth-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    openfeign:
      enabled: false

auth:
  jwt:
    access:
      secret: 0123456789012345678901234567890123456789012345678901234567890123
      expiration: 60000
    refresh:
      secret: 0123456789012345678901234567890123456789012345678901234567890123
      expiration: 120000

  concurrent:
    max-sessions: 3

eureka:
  client:
    enabled: false

resilience4j:
  enabled: false
