version: '3.8'

services:
  rushdeal_postgres:
    image: postgres:16-alpine
    container_name: rushdeal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rushdeal}
      POSTGRES_USER: ${DB_USERNAME:-rushdeal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rushdeal}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "15432:5432"
    volumes:
      - rushdeal_pg_data:/var/lib/postgresql/data
      - ./scripts/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-rushdeal} -d ${DB_NAME:-rushdeal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rushdeal-network

  rushdeal_auth_redis:
    image: redis:7-alpine
    container_name: rushdeal_auth_redis
    restart: unless-stopped
    ports:
      - "6378:6379"
    volumes:
      - rushdeal_auth_redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rushdeal-network

  rushdeal_user_redis:
    image: redis:7-alpine
    container_name: rushdeal_user_redis
    restart: unless-stopped
    ports:
      - "6383:6379"
    volumes:
      - rushdeal_user_redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rushdeal-network

  rushdeal_queue_redis: # 서비스 이름은 rushdeal_redis로 설정합니다.
    image: redis:7-alpine
    container_name: rushdeal_queue_redis
    restart: unless-stopped
    ports:
      - "6380:6379" # 6379가 Redis 기본 포트이나, 호스트 포트를 6380으로 설정하여 기존 충돌을 피합니다.
    volumes:
      - rushdeal_queue_redis_data:/data # 데이터 영속성을 위한 볼륨
    command: redis-server --save 60 1 --loglevel warning # 개발 중 데이터 날아가는거 방지 위해 60초마다 스냅샷 저장
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rushdeal-network

  rushdeal_order_redis:
    image: redis:7-alpine
    container_name: rushdeal_order_redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - rushdeal_order_redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rushdeal-network

  rushdeal_timedeal_redis:
    image: redis:7-alpine
    container_name: rushdeal_timedeal_redis
    restart: unless-stopped
    ports:
      - "6382:6379"
    volumes:
      - rushdeal_timedeal_redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rushdeal-network

  rushdeal_gateway_redis:
    image: redis:7-alpine
    container_name: rushdeal_gateway_redis
    restart: unless-stopped
    ports:
      - "6384:6379"
    volumes:
      - rushdeal_gateway_redis_data:/data
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rushdeal-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: rushdeal_zookeeper
    platform: linux/amd64
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - rushdeal-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: rushdeal_kafka
    platform: linux/amd64
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - rushdeal-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: rushdeal_kafka_ui
    platform: linux/amd64
    ports:
      - "18080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
    networks:
      - rushdeal-network

  elasticsearch:
    build:
      context: .
      dockerfile: Dockerfile.elasticsearch
    image: rush-deal-elasticsearch
    container_name: rushdeal_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - "9200:9200"
    volumes:
      - rushdeal_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -E 'yellow|green'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - rushdeal-network


  # =========================================
  # [MSA 서비스] 스프링 부트 앱 설정
  # =========================================

  discovery-service:
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        SERVICE_NAME: discovery-service
    container_name: rushdeal_discovery_service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8761
    ports:
      - "8761:8761"
    networks:
      - rushdeal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        SERVICE_NAME: api-gateway
    container_name: rushdeal_api_gateway
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8080
      REDIS_HOST: rushdeal_gateway_redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRED: ${JWT_ACCESS_EXPIRED:-3600000}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRED: ${JWT_REFRESH_EXPIRED:-604800000}
      EUREKA_URL: http://discovery-service:8761/eureka/
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: ${ZIPKIN_URL:-http://zipkin:9411/api/v2/spans}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_RATE:-1.0}
    ports:
      - "8080:8080"
    depends_on:
      discovery-service:
        condition: service_healthy
      rushdeal_gateway_redis:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    networks:
      - rushdeal-network
    restart: unless-stopped

  auth-service:
    container_name: rushdeal_auth_service
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        SERVICE_NAME: auth-service
    environment:
      # Spring
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: ${AUTH_SERVER_PORT:-8000}

      # Database
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # Redis
      REDIS_HOST: ${AUTH_REDIS_HOST:-rushdeal_auth_redis}
      AUTH_REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # JWT
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRED: ${JWT_ACCESS_EXPIRED:-3600000}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRED: ${JWT_REFRESH_EXPIRED:-604800000}

      # Eureka
      EUREKA_ENABLED: ${EUREKA_ENABLED:-true}
      EUREKA_URL: http://discovery-service:8761/eureka/

      # Auth Config
      AUTH_MAX_CONCURRENT_SESSIONS: ${AUTH_MAX_CONCURRENT_SESSIONS:-3}

      # Monitoring
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: ${ZIPKIN_URL:-http://zipkin:9411/api/v2/spans}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_RATE:-1.0}
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: true
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
    ports:
      - "${AUTH_SERVER_PORT:-8000}:${AUTH_SERVER_PORT:-8000}"
    depends_on:
      rushdeal_postgres:
        condition: service_healthy
      rushdeal_auth_redis:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
       - rushdeal-network
    restart: unless-stopped

  user-service:
    container_name: rushdeal_user_service
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        SERVICE_NAME: user-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: ${USER_SERVER_PORT:-8060}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${USER_REDIS_HOST:-rushdeal_user_redis}
      USER_REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:29092}
      EUREKA_ENABLED: ${EUREKA_ENABLED:-true}
      EUREKA_URL: http://discovery-service:8761/eureka/
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}

      # Monitoring
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: ${ZIPKIN_URL:-http://zipkin:9411/api/v2/spans}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_RATE:-1.0}
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: true
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
    ports:
      - "${USER_SERVER_PORT:-8060}:${USER_SERVER_PORT:-8060}"
    depends_on:
      rushdeal_postgres:
        condition: service_healthy
      rushdeal_user_redis:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - rushdeal-network
    restart: unless-stopped

  order-service:
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        SERVICE_NAME: order-service
    container_name: rushdeal_order_service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: ${ORDER_SERVER_PORT:-8050}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: rushdeal_order_redis
      ORDER_REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:29092}
      EUREKA_ENABLED: ${EUREKA_ENABLED:-true}
      EUREKA_URL: http://discovery-service:8761/eureka/
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      SHOW_SQL: ${SHOW_SQL:-false}
      SQL_INIT_MODE: ${SQL_INIT_MODE:-never}

      # Feign client URLs
      USER_SERVICE_URL: http://user-service:8060
      TIMEDEAL_SERVICE_URL: http://timedeal-service:8030
      QUEUE_SERVICE_URL: http://queue-service:8040
      PAYMENT_SERVICE_URL: http://payment-service:8010

      # Monitoring
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: ${ZIPKIN_URL:-http://zipkin:9411/api/v2/spans}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_RATE:-1.0}
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: true
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
    ports:
      - "${ORDER_SERVER_PORT:-8050}:${ORDER_SERVER_PORT:-8050}"
    depends_on:
      rushdeal_postgres:
        condition: service_healthy
      rushdeal_order_redis:
        condition: service_healthy
      kafka:
        condition: service_started
      zipkin:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - rushdeal-network
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        SERVICE_NAME: payment-service
    container_name: rushdeal_payment_service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: ${PAYMENT_SERVER_PORT:-8010}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_ENABLED: ${EUREKA_ENABLED:-true}
      EUREKA_URL: http://discovery-service:8761/eureka/
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      SHOW_SQL: ${SHOW_SQL:-false}
      PORTONE_API_SECRET: ${PORTONE_API_SECRET}
      PORTONE_STORE_ID: ${PORTONE_STORE_ID}
      PORTONE_CHANNEL_KEY: ${PORTONE_CHANNEL_KEY}
      PORTONE_WEBHOOK: ${PORTONE_WEBHOOK}

      # Feign client URLs
      ORDER_SERVICE_URL: http://order-service:8050

      # Monitoring
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: ${ZIPKIN_URL:-http://zipkin:9411/api/v2/spans}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_RATE:-1.0}
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: true
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
    ports:
      - "${PAYMENT_SERVER_PORT:-8010}:${PAYMENT_SERVER_PORT:-8010}"
    depends_on:
      rushdeal_postgres:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - rushdeal-network
    restart: unless-stopped

  product-service:
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        SERVICE_NAME: product-service
    container_name: rushdeal_product_service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: ${PRODUCT_SERVER_PORT:-8020}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_ENABLED: ${EUREKA_ENABLED:-true}
      EUREKA_URL: http://discovery-service:8761/eureka/
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      SHOW_SQL: ${SHOW_SQL:-false}
      SQL_INIT_MODE: ${SQL_INIT_MODE:-never}

      # Monitoring
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: ${ZIPKIN_URL:-http://zipkin:9411/api/v2/spans}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_RATE:-1.0}
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: true
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
    ports:
      - "${PRODUCT_SERVER_PORT:-8020}:${PRODUCT_SERVER_PORT:-8020}"
    depends_on:
      rushdeal_postgres:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - rushdeal-network
    restart: unless-stopped

  queue-service:
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        SERVICE_NAME: queue-service
    container_name: rushdeal_queue_service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: ${QUEUE_SERVER_PORT:-8040}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${QUEUE_REDIS_HOST:-rushdeal_queue_redis}
      QUEUE_REDIS_PORT: 6379
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:29092}
      EUREKA_ENABLED: ${EUREKA_ENABLED:-true}
      EUREKA_URL: http://discovery-service:8761/eureka/
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      SHOW_SQL: ${SHOW_SQL:-false}

      # Monitoring
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: ${ZIPKIN_URL:-http://zipkin:9411/api/v2/spans}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_RATE:-1.0}
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: true
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
    ports:
      - "${QUEUE_SERVER_PORT:-8040}:${QUEUE_SERVER_PORT:-8040}"
    depends_on:
      rushdeal_postgres:
        condition: service_healthy
      rushdeal_queue_redis:
        condition: service_healthy
      kafka:
        condition: service_started
      zipkin:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - rushdeal-network
    restart: unless-stopped

  timedeal-service:
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        SERVICE_NAME: timedeal-service
    container_name: rushdeal_timedeal_service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: ${TIMEDEAL_SERVER_PORT:-8030}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${TIMEDEAL_REDIS_HOST:-rushdeal_timedeal_redis}
      TIMEDEAL_REDIS_PORT: 6379
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:29092}
      ELASTICSEARCH_URIS: ${ELASTICSEARCH_URIS:-http://elasticsearch:9200}
      EUREKA_ENABLED: ${EUREKA_ENABLED:-true}
      EUREKA_URL: http://discovery-service:8761/eureka/
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      SHOW_SQL: ${SHOW_SQL:-false}
      SQL_INIT_MODE: ${SQL_INIT_MODE:-never}

      # Feign client URLs
      PRODUCT_SERVICE_URL: http://product-service:8020

      # Monitoring
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: ${ZIPKIN_URL:-http://zipkin:9411/api/v2/spans}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_RATE:-1.0}
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: true
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
    ports:
      - "${TIMEDEAL_SERVER_PORT:-8030}:${TIMEDEAL_SERVER_PORT:-8030}"
    depends_on:
      rushdeal_postgres:
        condition: service_healthy
      rushdeal_timedeal_redis:
        condition: service_healthy
      kafka:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      zipkin:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - rushdeal-network
    restart: unless-stopped

  # =========================================
  # [모니터링] Prometheus, Grafana, Zipkin
  # =========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: rushdeal_prometheus
    restart: unless-stopped
    deploy: # 리소스 제한 추가
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=5d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - rushdeal-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: rushdeal_grafana
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=redis-datasource
    depends_on:
      - prometheus
    networks:
      - rushdeal-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: rushdeal_zipkin
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 256M
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
      - JAVA_OPTS=-Xms512m -Xmx512m
    networks:
      - rushdeal-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9411/health" ]
