version: "3.8"

services:
  # =========================================
  # PostgreSQL
  # =========================================
  rushdeal_postgres:
    image: postgres:16-alpine
    container_name: rushdeal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rushdeal
      POSTGRES_USER: rushdeal
      POSTGRES_PASSWORD: rushdeal
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "15432:5432"
    volumes:
      - rushdeal_pg_data:/var/lib/postgresql/data
      - ./scripts/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rushdeal -d rushdeal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rushdeal-network

  # =========================================
  # Redis Instances
  # =========================================
  rushdeal_auth_redis:
    image: redis:7-alpine
    container_name: rushdeal_auth_redis
    restart: unless-stopped
    ports:
      - "6378:6379"
    volumes:
      - rushdeal_auth_redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rushdeal-network

  rushdeal_user_redis:
    image: redis:7-alpine
    container_name: rushdeal_user_redis
    restart: unless-stopped
    ports:
      - "6383:6379"
    volumes:
      - rushdeal_user_redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rushdeal-network

  rushdeal_queue_redis:
    image: redis:7-alpine
    container_name: rushdeal_queue_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - rushdeal_queue_redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rushdeal-network

  rushdeal_order_redis:
    image: redis:7-alpine
    container_name: rushdeal_order_redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - rushdeal_order_redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rushdeal-network

  rushdeal_timedeal_redis:
    image: redis:7-alpine
    container_name: rushdeal_timedeal_redis
    restart: unless-stopped
    ports:
      - "6382:6379"
    volumes:
      - rushdeal_timedeal_redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rushdeal-network

  rushdeal_gateway_redis:
    image: redis:7-alpine
    container_name: rushdeal_gateway_redis
    restart: unless-stopped
    ports:
      - "6384:6379"
    volumes:
      - rushdeal_gateway_redis_data:/data
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rushdeal-network

  # =========================================
  # Redis Management UI
  # =========================================
  redisinsight:
    image: redis/redisinsight:latest
    container_name: rushdeal_redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      - rushdeal_auth_redis
      - rushdeal_user_redis
      - rushdeal_queue_redis
      - rushdeal_order_redis
      - rushdeal_timedeal_redis
      - rushdeal_gateway_redis
    networks:
      - rushdeal-network

  # =========================================
  # Kafka & Zookeeper
  # =========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: rushdeal_zookeeper
    platform: linux/amd64
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - rushdeal-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: rushdeal_kafka
    platform: linux/amd64
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: rushdeal_zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - rushdeal-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: rushdeal_kafka_ui
    platform: linux/amd64
    ports:
      - "18080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
    networks:
      - rushdeal-network

  # =========================================
  # Zipkin (Distributed Tracing)
  # =========================================
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: rushdeal_zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
    networks:
      - rushdeal-network

  # =========================================
  # Prometheus (Metrics)
  # =========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: rushdeal_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - rushdeal-network

  # =========================================
  # Grafana (Monitoring Dashboard)
  # =========================================
  grafana:
    image: grafana/grafana:latest
    container_name: rushdeal_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    depends_on:
      - prometheus
    networks:
      - rushdeal-network

volumes:
  rushdeal_pg_data:
  rushdeal_gateway_redis_data:
  rushdeal_auth_redis_data:
  rushdeal_user_redis_data:
  rushdeal_queue_redis_data:
  rushdeal_order_redis_data:
  rushdeal_timedeal_redis_data:
  prometheus_data:
  grafana_data:

networks:
  rushdeal-network:
    driver: bridge
