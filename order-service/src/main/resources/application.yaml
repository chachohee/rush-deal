# order-service
server:
  port: ${ORDER_SERVER_PORT:8050}
  tomcat:
    threads:
      max: 200              # 최대 스레드 수
      min-spare: 10
    max-connections: 8192   # 최대 연결 수
    accept-count: 100       # 대기 큐 크기

spring:
  application:
    name: order-service
  batch:
    jdbc:
      initialize-schema: never
      table-prefix: order_schema.BATCH_
    job:
      enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
#      ddl-auto: create-drop
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        default_schema: order_schema
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${ORDER_REDIS_PORT:6381}
      password: ${REDIS_PASSWORD:}
  sql:
    init:
      mode: always
#      mode: ${SQL_INIT_MODE:never}
      encoding: UTF-8
      schema-locations:
        - classpath:sql/batch-schema.sql
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
    listener:
      ack-mode: record
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1000
        multiplier: 2.0
        max-interval: 10000

logging:
  level:
    com.rushcrew.order_service.application.validator: DEBUG  # Validator 로그 활성화
    com.rushcrew.order_service.application.saga: INFO

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

