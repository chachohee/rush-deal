server:
  port: ${ORDER_SERVER_PORT:8050}
  tomcat:
    threads:
      max: 1000
      min-spare: 100
    max-connections: 2000
    accept-count: 1000
    connection-timeout: 20000

spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    default-schema: order_schema
    locations: classpath:db/migration
  application:
    name: order-service

  batch:
    jdbc:
      initialize-schema: never
      table-prefix: order_schema.BATCH_
    job:
      enabled: false

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/rushdeal}
    username: ${DB_USERNAME:rushdeal}
    password: ${DB_PASSWORD:rushdeal}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        default_schema: order_schema

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${ORDER_REDIS_PORT:6381}
      password: ${REDIS_PASSWORD:}

  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      encoding: UTF-8
      schema-locations:
        - classpath:sql/batch-schema.sql

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
    listener:
      ack-mode: record
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1000
        multiplier: 2.0
        max-interval: 10000

  cloud:
    openfeign:
      client:
        config:
          user-service:
            url: ${USER_SERVICE_URL:http://localhost:8060}
          timedeal-service:
            url: ${TIMEDEAL_SERVICE_URL:http://localhost:8030}
          queue-service:
            url: ${QUEUE_SERVICE_URL:http://localhost:8040}
          payment-service:
            url: ${PAYMENT_SERVICE_URL:http://localhost:8010}

logging:
  level:
    com.rushcrew.order_service.application.validator: DEBUG
    com.rushcrew.order_service.application.saga: INFO

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
