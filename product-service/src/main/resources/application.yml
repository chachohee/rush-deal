# product-service
server:
  port: ${PRODUCT_SERVER_PORT:8020}

spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    default-schema: product_schema
    locations: classpath:db/migration
  application:
    name: product-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/rushdeal}
    username: ${DB_USERNAME:rushdeal}
    password: ${DB_PASSWORD:rushdeal}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        default_schema: product_schema
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:rushdeal}
  secret-key: ${MINIO_SECRET_KEY:rushdeal123}
  bucket: ${MINIO_BUCKET:rushdeal-products}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
