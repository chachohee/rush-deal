# timedeal-service
server:
  port: ${TIMEDEAL_SERVER_PORT:8030}

spring:
  application:
    name: timedeal-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${TIMEDEAL_REDIS_PORT:6382}
      password: ${REDIS_PASSWORD:}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        default_schema: time_deal_schema
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
  tracing:
    sampling:
      probability: 1.0
